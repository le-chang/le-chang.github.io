baseURL: "https://le-chang.github.io/"
languageCode: zh-cn
title: "常乐乐博士"
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

params:
  env: production
  title: "常乐乐博士"
  description: "博士后研究员 | 科学家 | 生命教育学者"
  author: 常乐乐博士
  
  # 首页信息
  homeInfoParams:
    Title: "欢迎来到我的个人网站"
    Content: >
      博士后研究员 × 科学家 × 生命教育学者 × 人生教练。
      
      让生命恢复美感，用文字重塑秩序。

      赋能高认知、高学历的创作者，在不迎合流量、不消耗自我的前提下，构建「写作表达 × 商业结构 × AI 协作」系统，用不内耗的写作方式，将真实生命经验转化为实现自我价值、并可长期复利的内容资产。

  # 社交链接
  socialIcons:
    - name: wechat
      url: "/wechat-qr/"  # 指向你的微信二维码页面
    - name: wechat-mp
      url: "/wechat-mp-qr/"  # 指向你的公众号二维码页面

  # SEO 相关
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  
  # 搜索
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# 菜单
menu:
  main:
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30

# 输出格式（支持搜索）
outputs:
  home:
    - HTML
    - RSS
    - JSON
